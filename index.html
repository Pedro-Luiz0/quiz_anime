<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniQuiz</title>
<meta name="description" content="Quiz interativo de anime com login, abertura, 10 perguntas e resultado final." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- LOGIN -->
    <section class="screen active" data-screen="login" style="background-image:url('images/login.webp')">
      <div class="overlay"></div>
      <form class="card login-card" id="login-form" autocomplete="off">
        <h1 class="login-title">LOGIN</h1>
        <p class="login-sub">Entre para acessar o quiz</p>
        <label>E-mail
          <input type="email" id="email" required placeholder="seuemail@anime.com" />
        </label>
        <label>Senha
          <input type="password" id="password" required placeholder="••••••••" />
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </section>

    <!-- INTRO -->
    <section class="screen" data-screen="intro" style="background-image:url('images/intro.png')">
      <div class="overlay"></div>
      <div class="card intro-card">
        <p class="kicker">Modo história</p>
        <h1>Bem-vindo ao AniQuiz</h1>
        <p id="intro-text">Avance pelas perguntas e veja sua pontuação final.</p>
        <button class="btn btn-start" id="start-btn">Iniciar ▶</button>
      </div>
    </section>

    <!-- QUIZ -->
    <section class="screen" data-screen="quiz">
      <img id="quiz-bg" class="bg-img" alt="" />
      <div class="overlay"></div>
      <div class="quiz-layout">
        <aside class="ring-wrap">
          <svg viewBox="0 0 180 180" class="ring">
            <circle class="ring-track" cx="90" cy="90" r="72"/>
            <circle class="ring-fill" cx="90" cy="90" r="72" id="ring-fill"/>
          </svg>
          <div class="ring-label" id="ring-label">0%</div>
        </aside>
        <div class="card question-card">
          <p class="step" id="step">Pergunta 1 de 10</p>
          <h2 class="question-title" id="question-title"></h2>
          <div class="options" id="options"></div>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section class="screen" data-screen="result" style="background-image:url('images/result.jpg')">
      <div class="overlay"></div>
      <div class="card result-card">
        <h1 class="result-title">PARABÉNS POR TERMINAR O QUIZ!</h1>
        <h2 class="result-sub" id="result-sub">Você acertou 0 questões</h2>
        <div class="pie-wrap">
          <svg viewBox="0 0 200 200" class="pie" id="pie"></svg>
          <div class="pie-legend">
            <span><i style="background:#f5a85a"></i>Acertos <b id="pct-right">0%</b></span>
            <span><i style="background:#a78bfa"></i>Erros <b id="pct-wrong">0%</b></span>
          </div>
        </div>
        <button class="btn btn-start" id="restart-btn">Jogar novamente ⟲</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
